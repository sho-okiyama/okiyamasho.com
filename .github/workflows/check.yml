# Pull requests (e.g. Dependabot updates): build and run the safety checks. Never deploys.
name: Check pull request

on:
  pull_request:
    branches: [main]

permissions: {}

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      HUGO_VERSION: "0.168.0"
      HUGO_SHA256: "fada83ad56bb27ed4cb7dd81590303bdac16140f944ac4e66fc248117e2d5594" # keep in sync with deploy.yml
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Hugo (pinned version, verified checksum)
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fsSL --proto '=https' --tlsv1.2 -o hugo.tar.gz \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          echo "${HUGO_SHA256}  hugo.tar.gz" | sha256sum --check --strict -
          mkdir -p hugo-bin
          tar -xzf hugo.tar.gz -C hugo-bin hugo
          echo "$RUNNER_TEMP/hugo-bin" >> "$GITHUB_PATH"

      - name: Build
        run: hugo --gc --minify --cleanDestinationDir --environment production

      - name: Check the generated site
        run: |
          python3 -I scripts/check_site.py public
          python3 -I scripts/test_check_site.py public
          node scripts/test_redirect.js public/js/legacy-redirect.min.*.js
