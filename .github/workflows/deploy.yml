# Build the site with a pinned, checksum-verified Hugo, check the output, then deploy to GitHub Pages.
# Security notes:
#  - Only pushes to main (and manual runs on main) deploy. Pull requests never deploy and
#    pull_request_target is never used.
#  - Workflow-wide permissions are empty; each job gets only what it needs.
#    build: read the repository. deploy: write to Pages + an OIDC token (no long-lived secrets).
#  - Third-party code is pinned: actions by full commit SHA, Hugo by version + SHA-256.
name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      HUGO_VERSION: "0.168.0"
      # sha256 of hugo_0.168.0_linux-amd64.tar.gz (matches both the release's checksums.txt
      # and GitHub's asset digest, checked 2026-11-08). Update together with HUGO_VERSION.
      HUGO_SHA256: "fada83ad56bb27ed4cb7dd81590303bdac16140f944ac4e66fc248117e2d5594"
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Hugo (pinned version, verified checksum)
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fsSL --proto '=https' --tlsv1.2 -o hugo.tar.gz \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          echo "${HUGO_SHA256}  hugo.tar.gz" | sha256sum --check --strict -
          mkdir -p hugo-bin
          tar -xzf hugo.tar.gz -C hugo-bin hugo
          echo "$RUNNER_TEMP/hugo-bin" >> "$GITHUB_PATH"

      - name: Build
        run: |
          hugo version
          hugo --gc --minify --cleanDestinationDir --environment production

      - name: Check the generated site
        run: |
          python3 -I scripts/check_site.py public
          python3 -I scripts/test_check_site.py public

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: public

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
