{{ define "main" }}
<header class="page-header"><h1 class="page-title">{{ .Title }}</h1></header>
<ul class="post-list">
  {{- range .Pages.ByDate.Reverse }}
  <li><a href="{{ .RelPermalink }}">{{ .Title }}</a> <span class="post-list__date">{{ .Date.Format "2006年1月2日" }}</span></li>
  {{- end }}
</ul>
{{ end }}
